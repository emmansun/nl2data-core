[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2data-core"
version = "0.1.0"
description = "A governed and extensible Python framework for natural-language access to heterogeneous enterprise data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NL2Data Contributors" }]
keywords = ["nl2data", "natural language", "data", "enterprise", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# SQL parser + evaluation extras; SQLite itself is stdlib (no dependency).
sql = ["sqlglot>=25.0,<30"]
# Optional PostgreSQL conformance profile driver (lazy; never imported by the base package).
postgres = ["psycopg[binary,pool]>=3.1,<4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "sqlglot>=25.0,<30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/nl2data-openai/tests",
    "packages/nl2data-semantic-catalog-postgres/tests",
    "packages/nl2data-admin-service/tests",
    "packages/nl2data-postgres/tests",
    "packages/nl2data-mongodb/tests",
    "packages/nl2data-workflow-postgres/tests",
    "packages/nl2data-memory-redis/tests",
]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["src", "packages/nl2data-openai/src", "packages/nl2data-semantic-catalog-postgres/src", "packages/nl2data-admin-service/src", "packages/nl2data-postgres/src", "packages/nl2data-mongodb/src", "packages/nl2data-workflow-postgres/src", "packages/nl2data-memory-redis/src", "demo"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "demo", "packages/nl2data-openai/src", "packages/nl2data-semantic-catalog-postgres/src", "packages/nl2data-admin-service/src", "packages/nl2data-postgres/src", "packages/nl2data-mongodb/src", "packages/nl2data-workflow-postgres/src", "packages/nl2data-memory-redis/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
